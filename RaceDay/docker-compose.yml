services:
  web:
    build:
      context: ..
      dockerfile: RaceDay.Web/Dockerfile
    image: raceday-web
    ports:
      - "8080:8080"
    environment:
      # Where the RaceDay API is running (on your computer, outside Docker)
      - Api__BaseUrl=${API_BASE_URL:-http://host.docker.internal:5107/}
    extra_hosts:
      - "host.docker.internal:host-gateway"