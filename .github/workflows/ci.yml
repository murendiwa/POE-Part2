name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Validate repository structure
        run: |
          missing=0

          # Require the solution file at repo root
          if [ ! -f "RaceDay.slnx" ]; then
            echo "::error::Missing required file: RaceDay.slnx"
            missing=1
          fi

          # Warn on missing non-critical files
          for f in README.md .gitignore RaceDay/RaceDay.csproj RaceDay/Program.cs RaceDay.Test/RaceDay.Test.csproj; do
            if [ ! -f "$f" ]; then echo "::warning::Missing file: $f"; fi
          done

          # Migrations folder is optional (may be generated during runtime)
          if [ ! -d "RaceDay/Migrations" ]; then
            echo "::warning::Optional folder missing: RaceDay/Migrations"
          fi

          if git ls-files | grep -qE '(^|/)(bin|obj)/'; then
            echo "::error::Build output (bin/ or obj/) has been committed"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Repository structure is valid."

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore RaceDay.slnx

      - name: Build
        run: dotnet build RaceDay.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RaceDay.slnx --configuration Release --no-build --verbosity normal
